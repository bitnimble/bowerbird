[project]
name = "upscaler"
version = "0.1.0"
description = "Trains the 2x RAW mosaic upscaler"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "torch>=2.9,<2.12", "training"]

[project.scripts]
train = "upscaler.train:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
