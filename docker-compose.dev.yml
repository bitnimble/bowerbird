# Dev variant: no app build. Uses the Dockerfile's `base` stage (bun + LibRaw
# only), live-mounts this repo, and runs bun in watch mode.
#   docker compose -f docker-compose.dev.yml up
services:
  bowerbird-dev:
    build:
      context: .
      target: base # bun + libraw-dev; the app source is mounted, not baked in
    image: bowerbird:dev-base
    container_name: bowerbird-dev
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun --watch run src/index.ts"
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /data/bowerbird.db
      WATCH_ENABLED: ${WATCH_ENABLED:-true}
      WATCH_DEBOUNCE_MS: ${WATCH_DEBOUNCE_MS:-2000}
      PROCESSING_CONCURRENCY: ${PROCESSING_CONCURRENCY:-4}
      SMALL_THUMBNAIL_SIZE: ${SMALL_THUMBNAIL_SIZE:-800}
      FULL_THUMBNAIL_SIZE: ${FULL_THUMBNAIL_SIZE:-3840}
      SMALL_THUMBNAIL_QUALITY: ${SMALL_THUMBNAIL_QUALITY:-80}
      FULL_THUMBNAIL_QUALITY: ${FULL_THUMBNAIL_QUALITY:-90}
    volumes:
      # This repo, live-mounted for hot reload. REPO_DIR must be set in .env to the
      # repo's path ON THE DOCKER HOST (it differs from the path in this container).
      - "${REPO_DIR:?set REPO_DIR in .env to this repo's absolute path on the docker host}:/app"
      # node_modules stays container-side (installed on first run): the host copy is
      # not shadowed/overwritten and platform binaries (sharp) match the image.
      - /app/node_modules
      - "${PHOTOS_DIR:-./photos}:/photos"
      - bowerbird-db-dev:/data

volumes:
  bowerbird-db-dev:
