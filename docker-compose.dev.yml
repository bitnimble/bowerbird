# Dev variant: no app build. Uses the Dockerfile's `base` stage (bun and the pixel
# libraries), live-mounts this repo, and runs the API in watch mode plus the web
# dev server.
#   docker compose -f docker-compose.dev.yml up
#
# Ports: WEB_PORT (default 5173) is the only one published. The API is reached
# through the web server's proxy, so it stays inside on a fixed 3000.
#
# rawshim itself is not in that stage: `base` carries the runtime libraries but not
# the headers, so build it on the host with `bun run build:native` - which is what
# the loader prefers in a live-mounted tree anyway. `bun run dev` watches that build
# output and restarts on a new .so, so a native rebuild needs no container restart.
services:
  bowerbird-dev:
    build:
      context: .
      target: base # bun + the pixel libraries; the app source is mounted, not baked in
    image: bowerbird:dev-base
    container_name: bowerbird-dev
    # Set here rather than inherited: this service builds the `base` stage, which is
    # shared with the native build and so cannot carry a USER of its own. Without it
    # a dev container writes root-owned renditions into the live-mounted repo and
    # photo library, same as production did.
    user: "1000:1000"
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev"
    # The web service shares this network namespace, so its published port lives
    # here too.
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    # Only what has to be known before the catalogue can be opened. Everything
    # else is a setting on the app's Settings page, stored in the DB (§15).
    environment:
      # Loopback, not 0.0.0.0: the only thing that talks to the API is the web
      # server, which shares this network namespace. Nothing reaches it from
      # outside, including the host.
      HOST: 127.0.0.1
      PORT: 3000
      DB_PATH: /data/bowerbird.db
    volumes:
      # This repo, live-mounted for hot reload. REPO_DIR must be set in .env to the
      # repo's path ON THE DOCKER HOST (it differs from the path in this container).
      - "${REPO_DIR:?set REPO_DIR in .env to this repo's absolute path on the docker host}:/app"
      # node_modules stays container-side (installed on first run): the host copy is
      # not shadowed/overwritten and platform binaries match the image.
      - /app/node_modules
      - /app/web/node_modules
      - "${PHOTOS_DIR:-./photos}:/photos"
      - bowerbird-db-dev:/data

  # Vite dev server for web/. Same image - it needs bun and nothing else, and
  # reusing it means no second build.
  bowerbird-web-dev:
    image: bowerbird:dev-base
    depends_on:
      - bowerbird-dev
    container_name: bowerbird-web-dev
    user: "1000:1000"
    working_dir: /app/web
    command: sh -c "bun install --frozen-lockfile && bun run dev.ts --port ${WEB_PORT:-5173}"
    # Shares the API container's network stack rather than linking to it, so the
    # proxy target is plain 127.0.0.1:3000 with no container-only hostname
    # anywhere - and the API can stay on loopback, unreachable from outside.
    network_mode: "service:bowerbird-dev"
    environment:
      # Where this server proxies /api and /image to; the browser only ever talks
      # to this one. Reached over the shared network namespace below.
      VITE_API_PORT: 3000
      VITE_ALLOWED_HOSTS: bowerbird.kumo.dev
    volumes:
      - "${REPO_DIR:?set REPO_DIR in .env to this repo's absolute path on the docker host}:/app"
      - /app/node_modules
      - /app/web/node_modules

volumes:
  bowerbird-db-dev:
