# Dev variant: no app build. Uses the Dockerfile's `dev` stage (bun, the pixel
# libraries, and the ffmpeg the tests measure against), live-mounts this repo, and
# runs the API in watch mode plus the web dev server.
#   docker compose -f docker-compose.dev.yml up
#
# Ports: WEB_PORT (default 5173) is the only one published. The API is reached
# through the web server's proxy, so it stays inside on a fixed 3000.
#
# rawshim itself is not in that stage: it carries the runtime libraries but not the
# headers, so build it on the host with `bun run build:native` - which is what the
# loader prefers in a live-mounted tree anyway. `bun run dev` watches that build
# output and restarts on a new .so, so a native rebuild needs no container restart.
services:
  bowerbird-dev:
    build:
      context: .
      target: dev # bun + the pixel libraries; the app source is mounted, not baked in
    image: bowerbird:dev
    container_name: bowerbird-dev
    # Set here rather than inherited: this service builds a stage shared with the
    # native build, which cannot carry a USER of its own. Without it
    # a dev container writes root-owned files into the live-mounted repo and photo
    # library, same as production did.
    user: "1000:1000"
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev"
    # The web service shares this network namespace, so its published port lives
    # here too.
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    # As production, and for the same reason: without these the container falls back to
    # lavapipe and everything merely gets slow. `docker-compose.yml` says what RENDER_GID
    # is and how to find it. `bun test test/integration` wants it too - those decode real
    # files, and on the CPU rasteriser they crawl rather than fail.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-106}"
    # An NVIDIA card, where the host has one and the container toolkit to inject it.
    #
    # **`graphics` is the one that matters and the one everybody leaves out.** `compute` alone
    # brings CUDA and no Vulkan ICD, so the container ends up with the devices, the libraries,
    # and no adapter - which looks exactly like not having asked for the GPU at all. The driver
    # userspace cannot be installed in the image either: `libGLX_nvidia.so.<version>` handshakes
    # with the host's kernel module and a mismatched pair refuses to initialise, so the toolkit
    # bind-mounts the host's own at start and the two agree by construction.
    #
    # Harmless on a host with no NVIDIA card and no toolkit: `NVIDIA_VISIBLE_DEVICES` is read by
    # a runtime hook that is not there, and the AMD path above is untouched.
    runtime: "${NVIDIA_RUNTIME:-runc}"
    # Uncomment to profile the native side with `perf`, and comment it back out afterwards.
    #
    # **The blocker is seccomp, not `perf_event_paranoid` and not capabilities.** Docker's default
    # seccomp profile denies `perf_event_open` outright, so every event is refused - including
    # software ones like `cpu-clock`, which is the tell: a paranoid-level problem would have
    # allowed those. The host's `perf_event_paranoid` is already 2, which permits profiling your
    # own processes in user space, and that is all a decode profile needs. Raise it to 1 on the
    # *host* only if you want kernel symbols, and add `cap_add: [PERFMON]` only for system-wide.
    #
    # The image carries neither tool: `apt-get install linux-perf binutils` as root inside the
    # running container. `binutils` is not optional - without `addr2line` a profile can only name
    # functions, and the interesting question is which line inside `decode_line`.
    #
    # Debian's trixie `linux-perf` installs a real `/usr/bin/perf` rather than the version-matching
    # shim, so a 6.12 perf samples a 6.13 kernel without complaint. `perf annotate` segfaults on
    # this crate's larger Rust symbols; `perf report --sort srcline` answers the same question.
    #security_opt:
    #  - seccomp:unconfined
    # Only what has to be known before the catalogue can be opened. Everything
    # else is a setting on the app's Settings page, stored in the DB (§15).
    environment:
      # Loopback, not 0.0.0.0: the only thing that talks to the API is the web
      # server, which shares this network namespace. Nothing reaches it from
      # outside, including the host.
      HOST: 127.0.0.1
      PORT: 3000
      DB_PATH: /config/bowerbird.db
      DATA_DIR: /data
      # Read by the NVIDIA container runtime's hook, and ignored where there is no such hook.
      # See `runtime:` above for why `graphics` is the member that matters.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,compute,utility
    volumes:
      # This repo, live-mounted for hot reload. REPO_DIR must be set in .env to the
      # repo's path ON THE DOCKER HOST (it differs from the path in this container).
      - "${REPO_DIR:?set REPO_DIR in .env to this repo's absolute path on the docker host}:/app"
      # node_modules stays container-side (installed on first run): the host copy is
      # not shadowed/overwritten and platform binaries match the image. Named and
      # shared with the web service so a schema file under /app/src that imports a
      # root dep (zod) resolves the same tree Vite sees from /app/web.
      - bowerbird-node-modules:/app/node_modules
      - bowerbird-web-node-modules:/app/web/node_modules
      - "${PHOTOS_DIR:-./photos}:/photos"
      - bowerbird-config-dev:/config
      - bowerbird-data-dev:/data

  # Vite dev server for web/. Same image - it needs bun and nothing else, and
  # reusing it means no second build.
  bowerbird-web-dev:
    image: bowerbird:dev
    depends_on:
      - bowerbird-dev
    container_name: bowerbird-web-dev
    user: "1000:1000"
    working_dir: /app/web
    command: sh -c "bun install --frozen-lockfile && bun run dev.ts --port ${WEB_PORT:-5173}"
    # Shares the API container's network stack rather than linking to it, so the
    # proxy target is plain 127.0.0.1:3000 with no container-only hostname
    # anywhere - and the API can stay on loopback, unreachable from outside.
    network_mode: "service:bowerbird-dev"
    environment:
      # Where this server proxies /api and /image to; the browser only ever talks
      # to this one. Reached over the shared network namespace below.
      VITE_API_PORT: 3000
      VITE_ALLOWED_HOSTS: bowerbird.kumo.dev
    volumes:
      - "${REPO_DIR:?set REPO_DIR in .env to this repo's absolute path on the docker host}:/app"
      - bowerbird-node-modules:/app/node_modules
      - bowerbird-web-node-modules:/app/web/node_modules

volumes:
  bowerbird-config-dev:
  bowerbird-data-dev:
  bowerbird-node-modules:
  bowerbird-web-node-modules:
