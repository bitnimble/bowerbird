[package]
name = "fit"
version = "0.1.0"
edition = "2024"

[features]
# The fixtures this crate's tests build matches and planes from, for the crates above it to use.
testing = []

[dependencies]
colour = { path = "../colour" }
denoise = { path = "../denoise" }
geometry = { path = "../geometry" }
gpu = { path = "../gpu" }
linalg = { path = "../linalg" }
render = { path = "../render" }
shaders = { path = "../shaders" }
trace = { path = "../trace" }
units = { path = "../units" }
wgpu = { version = "30.0", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "webgpu"] }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
half = { version = "2.7.1", default-features = false }
pollster = "0.4"
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
formats = { path = "../formats" }
serde_json = "1.0.151"
shaders = { path = "../shaders", features = ["layout"] }
