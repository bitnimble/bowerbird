[package]
name = "rawshim"
version = "0.1.0"
# 2024 so bindgen's generated `unsafe extern "C"` blocks parse as written. It also makes
# `unsafe_op_in_unsafe_fn` the default, which this crate already denies.
edition = "2024"

# cdylib so Bun can dlopen it. rlib so the grade microbench example can link the same crate.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["renditions"]

# The server's half: building renditions, which is what wants libavif and the lens database.
#
# Off, the crate links no C, which is everything the editor's open needs - `edit::prepare_bytes`
# reads the lens spline the camera recorded in the RAW itself (`lens::read_distortion`) rather
# than the database, and the display transform is the client's GPU rather than an AVIF encoder.
# That is what lets the desktop and mobile shells ship without a native library to resolve at
# all, and what keeps the browser's bundle clear of ~3.6MB of lens XML.
renditions = ["dep:lensdb"]

# The tests that decode a real RAW, which need the LFS fixtures and take seconds
# rather than milliseconds. Off by default so `cargo test` stays a thing you can run
# on every edit; `bun run test:native --features fixtures <name>` turns it on.
#
# It grades and it fits, so it needs the server's half. Named rather than assumed, or
# `--no-default-features --features fixtures` resolves to a suite that cannot see half of
# what it tests and fails to compile rather than saying why.
fixtures = ["renditions"]

# Each measures the server's half - the rendition grade, a JPEG read back for comparison - so
# none of them builds without the libraries that half links.
[[example]]
name = "bench_graded"
required-features = ["renditions"]

[[example]]
name = "bench_stages"
required-features = ["renditions"]

[[example]]
name = "fit_bench"
required-features = ["renditions"]

[[example]]
name = "crops"
required-features = ["renditions"]

[[example]]
name = "sweep"
required-features = ["renditions"]

[[example]]
name = "matches"
required-features = ["renditions"]

[[example]]
name = "demosaic_psnr"
required-features = ["renditions"]

[[example]]
name = "baseline"
required-features = ["renditions"]

[[example]]
name = "renders"
required-features = ["renditions"]

# Aligns a burst and writes the composite as AVIFs, which is libavif.
[[example]]
name = "assemble"
required-features = ["renditions"]

# Encodes both transfers to compare them, which is libavif.
[[example]]
name = "hdrq"
required-features = ["renditions"]

[[example]]
name = "aom_quality"
required-features = ["renditions"]

[[example]]
name = "avif_diff"
required-features = ["renditions"]

# Fits the camera match and writes a PQ still, which is both halves of the server's.
[[example]]
name = "headroom"
required-features = ["renditions"]

# Renders the same frame at two sizes and encodes both, which is libavif.
[[example]]
name = "supersample"
required-features = ["renditions"]

[[example]]
name = "snapshot_diff"
required-features = ["renditions"]

[[example]]
name = "import_fuse"
required-features = ["renditions"]

# Writes the crops it exists to be looked at, which is libavif.
[[example]]
name = "halo_seams"
required-features = ["renditions"]

# `filter_domain_delta`, `sdr_vs_hdr` and `denoise_before_warp` stood here. Each asked a
# question phase 0 has since decided and implemented - which domain the filters run in,
# what an SDR rendition costs against an HDR one, and which side of the warp the denoise
# belongs on - and each was written against the pipeline that had two of everything. There
# is no CPU grade to compare against now, no separate SDR path to price, and the filters do
# not convert a domain at all. Their findings are in the design doc they were written for
# (§0.2, §0.2.1, §0.2.3) and in DESIGN §10.3 and §10.9; the code is at `ef8dade`.

[dependencies]
# Our fork, vendored as a submodule. It reads every format the product imports, and it is the
# only thing that reads them.
rawler = { path = "../vendor/dnglab/rawler" }
# The lens database, and the only copyleft thing in the tree (THIRD_PARTY.md). Optional because
# the editor's open reads the spline the camera recorded in the RAW and never asks a database,
# so the Android and wasm builds link neither it nor its ~3.6MB of XML.
lensdb = { path = "../lensdb", optional = true }
fast_image_resize = "6.1.0"
# The f16 the detail and surround textures and the jacobian readback are held in. Conversion
# only - no feature of it is wanted.
half = { version = "2.7.1", default-features = false }
# libjpeg's DCT scaling is what makes a bounded decode cheap, and `Decoder::scale` is the
# pure-Rust decoder that exposes it. zune-jpeg is faster at a whole frame and cannot do it,
# which is the wrong way round here: every decode is bounded to the fit grid or a tile.
jpeg-decoder = { version = "0.3.2", default-features = false, features = ["rayon"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
# The grade runs here, on the same WGSL the editor runs, so there is one implementation of
# it rather than two that must be held in agreement (DESIGN 21.1). That costs the server an
# adapter; where there is no hardware one, `gpu::device` falls back to whatever software
# Vulkan is installed - very slow, and a path a machine with an iGPU never takes.
wgpu = "30.0"
# Already in the tree under `wgpu-types`, so naming it here adds nothing to compile. It carries
# the reinterprets a frame and a uniform block cross on - `Pod` proves the bit patterns and the
# cast checks the alignment, where a `from_raw_parts` states both in a comment nobody rechecks.
# `extern_crate_alloc` is what `pod_collect_to_vec` needs. wgpu-types asks for it too, so feature
# unification would hand it over anyway - named here because a decode that stops compiling when
# someone else's dependency drops a feature is a bad way to find that out.
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
pollster = "0.4"
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
png = "0.18.1"
# `png` reads the `cICP` chunk that makes a PNG HDR and does not write one, so an HDR export
# splices it in itself and needs the checksum every PNG chunk carries. Already in the tree
# under `png`; named here because this crate calls it directly.
crc32fast = "1.5.0"
rust_h265 = "0.1.0"
# TIFF, which an export offers for getting a photograph into another editor rather than for
# looking at: it holds sixteen bits happily and has no way to signal HDR that anything reads,
# so `schemas/export.ts` marks it SDR whatever the reader asks for.
tiff = "0.11.3"

# The resize is single-threaded (no `rayon` feature) - it is already milliseconds, and the
# callers sit inside their own parallelism. libavif and libjxl are linked on top, through
# build.rs, and only for a `renditions` build.

# An index product that wraps is a picture that comes out wrong rather than a crash, and
# these run over tens of millions of samples. Keep that failure loud in release.
#
# Applies when this crate is the root - the server's `build:native` and `cargo test`. The
# shells set their own, because cargo reads profiles from the top-level package only.
[profile.release]
overflow-checks = true
# Cargo defaults to per-crate optimisation in sixteen independent units. The decode's hot
# loops cross crate boundaries into `rawler` and `fast_image_resize`, which is exactly what
# those defaults leave on the table: on the shells the same change took the Windows binary
# from 26MB of `.text` to 7.
lto = "fat"
codegen-units = 1

# What every build that is not being shipped uses: the tests and any local `build:native`.
#
# **Same optimisation and the same overflow checks; the whole-program link is dropped and the
# codegen is cached.** Fat LTO into one codegen unit is worth 25% of the library's size and,
# measured here, nothing at all in speed: a 61MP decode ran 1635-1666ms under `release` and 1687ms
# under this, and the grade 1485-1664ms against 1481ms. What it costs is the build - 43s against
# 19s, and almost all of it serial, since one codegen unit and a whole-program link leave nothing
# to run in parallel. That is the wrong trade to pay on every edit and the right one to pay once,
# on the artefact a user installs.
#
# `opt-level` and `overflow-checks` are deliberately not relaxed. A debug decode is six times
# slower - measured, 229s of fixture suite against 36s - and the overflow checks are the
# reason a wrapping index over tens of millions of samples is a loud failure rather than a
# quietly wrong picture, which is exactly what the tests are for.
#
# **`incremental`, and so no LTO at all.** A crate is rustc's compilation unit, so an edit anywhere
# in this one recompiles all of it: there is no per-module cache to hit, and the only thing that
# reuses work across edits is incremental's own codegen units. The two settings go together rather
# than being two choices - cargo disables incremental when LTO is on, and says so - and this is the
# profile nothing ships from, so what is being traded away is a link nobody measures.
#
# **Not the benchmark's profile.** `scripts/bench.ts` builds `--release`, which is what
# `test/fixtures/bench.budget.json` is recorded against, so nothing here can move a budget.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Vulkan without wgpu in the way, for the one thing WGSL cannot say: the cooperative matrices a
# tensor core is reached through. Already in the tree - it is what wgpu's own Vulkan backend calls -
# and named here because `examples/coopmat.rs` opens a device of its own with it.
#
# **Not on wasm, where it does not compile at all**: it loads the Vulkan loader through
# `libloading`, which a browser has no equivalent of. An unconditional dependency here builds every
# native target and fails the one the editor runs on, which no cargo suite would have caught -
# `--all-targets` is every target for *this* triple.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ash = "0.38"

# Not ours: rawler enables uuid's `v4`, and uuid refuses to compile for wasm32 without a named
# source of randomness even where nothing generates one - here nothing does, the CR3 reader only
# compares UUIDs it read out of BMFF boxes. Declared as our dependency so feature unification hands
# it to rawler's copy, which is the only way to satisfy that gate without patching the fork.
[target.wasm32-unknown-unknown.dependencies]
uuid = { version = "1", features = ["js"] }
# The page's entry points (`src/wasm.rs`). The range is wgpu's own, so cargo unifies to one copy:
# `Device::as_webgpu` returns a handle built by *wgpu's* wasm-bindgen, and a second copy in the
# same link makes that a different crate's `JsValue` than the one this crate can return.
wasm-bindgen = "0.2.108"
# The canvas the editor draws on, taken from the page as an `OffscreenCanvas` and turned into a
# surface (`gpu::Canvas`). wgpu's own version and its own feature, so this unifies to the copy
# already in the tree rather than adding one - the same argument as `wasm-bindgen` above.
web-sys = { version = "0.3.85", features = ["OffscreenCanvas"] }
# What an exported `async fn` expands into: the adapter request cannot block a browser's thread,
# so `openGpuDevice` is a promise.
wasm-bindgen-futures = "0.4.58"

[build-dependencies]
bindgen = "0.72"

[dev-dependencies]
# The WGSL front end wgpu already carries, taken directly so `wgsl_call_shapes.rs` can walk the
# parsed IR rather than grep the text. Pinned to wgpu's own naga, so nothing new enters the tree.
naga = { version = "30.0", features = ["wgsl-in"] }
# `rawler`'s own, for the same reason: `DngWriter::preview` takes a `DynamicImage` and nothing else,
# and a synthetic burst with no embedded JPEG is a burst `composite_align` cannot open at all -
# `upright_preview_rgb` reads `preview_jpegs` and has no other way in. Pinned to the version rawler
# already builds, so this declares what is in the tree rather than adding to it.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
