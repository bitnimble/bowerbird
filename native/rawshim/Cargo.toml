[package]
name = "rawshim"
version = "0.1.0"
edition = "2021"

# cdylib so Bun can dlopen it exactly like libraw.so itself.
[lib]
crate-type = ["cdylib"]

[dependencies]
libvips = "2.3.0"
# The geometry search evaluates tens of candidates that share nothing but their
# inputs, which is the one genuinely parallel part of a fit.
rayon = "1.10"

[build-dependencies]
bindgen = "0.69"
