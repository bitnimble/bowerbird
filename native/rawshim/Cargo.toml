[package]
name = "rawshim"
version = "0.1.0"
# 2024 so bindgen's generated `unsafe extern "C"` blocks parse as written. It also makes
# `unsafe_op_in_unsafe_fn` the default, which this crate already denies.
edition = "2024"

# cdylib so Bun can dlopen it exactly like libraw.so itself. rlib so the grade
# microbench example can link the same crate.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["renditions"]

# The server's half: building renditions, which is what wants lensfun and libavif on top
# of LibRaw.
#
# Off, the crate is LibRaw and Rust, which is everything the editor's open needs -
# `edit::prepare` reads the lens spline the camera recorded in the RAW itself
# (`lens::read_distortion`) rather than lensfun's database, and the display transform is
# the client's GPU rather than an AVIF encoder. That is what lets the desktop and mobile
# shells link one C library instead of four, and lensfun in particular is the one with no
# prebuilt Android build anywhere.
renditions = []

# The tests that decode a real RAW, which need the LFS fixtures and take seconds
# rather than milliseconds. Off by default so `cargo test` stays a thing you can run
# on every edit; `bun run test:native:full` turns it on for the final check.
fixtures = []

# Both measure the server's half - one benchmarks the rendition grade, the other compares
# lensfun against the fitter - so neither builds without the libraries that half links.
[[example]]
name = "bench_graded"
required-features = ["renditions"]

[[example]]
name = "lensfun_vs_fitted"
required-features = ["renditions"]

# Which domain `image::finish` belongs in, measured in ΔE ITP rather than argued.
[[example]]
name = "filter_domain_delta"
required-features = ["renditions"]

# What an SDR rendition costs against an HDR one, whole-job rather than encode-only.
[[example]]
name = "sdr_vs_hdr"
required-features = ["renditions"]

# Whether denoising before the geometric warp leaves noise more uniform than after it.
[[example]]
name = "denoise_before_warp"
required-features = ["renditions"]

[dependencies]
fast_image_resize = "6.1.0"
# libjpeg's DCT scaling is what makes a bounded decode cheap, and `Decoder::scale` is the
# pure-Rust decoder that exposes it. zune-jpeg is faster at a whole frame and cannot do it,
# which is the wrong way round here: every decode is bounded to the fit grid or a tile.
jpeg-decoder = { version = "0.3.2", default-features = false }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
libblur = "0.24"
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The resize and blur are single-threaded (no `rayon` feature) - each is already
# milliseconds, and the callers sit inside their own parallelism. LibRaw, lensfun and
# libavif are linked on top, through build.rs.

# An index product that wraps is a picture that comes out wrong rather than a crash, and
# these run over tens of millions of samples. Keep that failure loud in release.
#
# Applies when this crate is the root - the server's `build:native` and `cargo test`. The
# shells set their own, because cargo reads profiles from the top-level package only.
[profile.release]
overflow-checks = true
# Cargo defaults to per-crate optimisation in sixteen independent units. The rendition
# pipeline's hot loops are generic over `Sample` and cross crate boundaries into
# `fast_image_resize` and `libblur`, which is exactly what those defaults leave on the
# table: on the shells the same change took the Windows binary from 26MB of `.text` to 7.
lto = "fat"
codegen-units = 1

[build-dependencies]
bindgen = "0.72"
