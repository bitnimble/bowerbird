[package]
name = "rawshim"
version = "0.1.0"
# 2024 so bindgen's generated `unsafe extern "C"` blocks parse as written. It also makes
# `unsafe_op_in_unsafe_fn` the default, which this crate already denies.
edition = "2024"

# cdylib so Bun can dlopen it exactly like libraw.so itself.
[lib]
crate-type = ["cdylib"]

# wasm-pack's bundled binaryen predates the wasm exception-handling proposal and aborts
# on LibRaw's throw sites ("unimplemented DCE control flow structure"). The module is
# already `-O3` from rustc and `--gc-sections` from the linker; what wasm-opt would add
# is not worth a second toolchain pinned to a compatible version.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
# The tests that decode a real RAW, which need the LFS fixtures and take seconds
# rather than milliseconds. Off by default so `cargo test` stays a thing you can run
# on every edit; `bun run test:native:full` turns it on for the final check.
fixtures = []

[dependencies]
fast_image_resize = "6.1.0"
libblur = "0.24"
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The resampling and filtering are shared: `fast_image_resize` and `libblur` build for both
# targets, so the fit runs the same code in the browser as on the server. Both are
# single-threaded here (no `rayon` feature) - each is already milliseconds, and the callers
# sit inside their own parallelism.
#
# Everything below is the server build's. wasm32 links LibRaw and nothing else: libvips
# encodes and decodes JPEG, and lensfun is geometry.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libvips = "2.3.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { git = "https://github.com/RReverser/wasm-bindgen-rayon.git", rev = "4eea1fa55a965ad516ef9f9e9449704c7eac91c5" }

# `usize` is 32 bits on wasm32 and 64 on the server, so an index product can be right in
# every rendition and wrap silently in the browser. Keep that failure loud in release.
[profile.release]
overflow-checks = true

[build-dependencies]
# 0.69 emits no functions at all for a wasm32 target - measured on a one-line header:
# `int probe(int);` generates `pub fn probe` under x86_64 and an empty file under
# wasm32-wasip1. Types come through either way, so the failure surfaces only as
# "cannot find function libraw_init" at every call site.
bindgen = "0.72"
