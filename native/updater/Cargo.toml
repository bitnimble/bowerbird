[package]
name = "updater"
version = "0.1.0"
edition = "2021"
description = "Replacing an installed Bowerbird with a newer one, from outside it"

[lib]
name = "updater"
path = "src/lib.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  # SHELLEXECUTEINFOW is gated on it, for its `hkeyClass` field.
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
