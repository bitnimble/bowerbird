services:
  bowerbird:
    build: .
    image: bowerbird:latest
    container_name: bowerbird
    restart: unless-stopped
    # The image already runs as uid 1000. Set this only where the host account that
    # owns the photo library is not 1000, e.g. user: "1001:1001".
    # user: "1000:1000"
    ports:
      - "${HOST_PORT:-3000}:3000"
    # Only what has to be known before the catalogue can be opened. Everything
    # else is a setting on the app's Settings page, stored in the DB (§15).
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      # SQLite DB persists on the named volume below (not in the image).
      DB_PATH: /data/bowerbird.db
    volumes:
      # Your photo library. Create libraries via the API with a root_path under
      # /photos (e.g. {"root_path": "/photos"}). Mounted read-write: sync moves
      # files, renditions live in <root>/.bowerbird and the Bin in <root>/Bin. The host directory
      # must be writable by the container user (uid 1000).
      - "${PHOTOS_DIR:-./photos}:/photos"
      - bowerbird-db:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/libraries').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  bowerbird-db:
