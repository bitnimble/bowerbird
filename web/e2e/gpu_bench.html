<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPU tick bench</title>
</head>
<body>
<pre id="out">waiting</pre>
<canvas id="stage"></canvas>
<script type="module">
// One tick, timed to GPU completion rather than to submit.
//
// `queue.submit` returns as soon as the commands are recorded, so timing around it
// measures this thread and not the work. `onSubmittedWorkDone` is what actually waits for
// the dispatches, which is the number worth comparing against `tick_bench`'s.
import { TickPipeline, tickFeatures, tickLimits } from '/src/features/raw_edit/gpu/tick_pipeline.ts';

const out = document.getElementById('out');
const query = new URLSearchParams(location.search);
const WIDTH = Number(query.get('width') ?? 2566);
const HEIGHT = Number(query.get('height') ?? 3840);
const RUNS = Number(query.get('runs') ?? 5);

/**
 * A compressive tone curve, per channel, over the curve's own domain.
 *
 * Not `HdrColour::identity()`'s ramp, which is what this used to send. A straight line
 * makes the exposure a global gain - every pixel scales by the same factor, the frame
 * cannot reorder, and `peakSweep` reports a perfect agreement it did not earn. A fitted
 * frame's curves compress highlights, so a bright pixel gains less than a dim one, which
 * is the only thing that can move a pixel in or out of the top hundred.
 *
 * The shoulder differs a little per channel for the same reason: the peak is taken over
 * the maximum channel, so three identical curves would make it a function of luma alone.
 */
function toneCurve(channel) {
  const shoulder = 0.5 + channel * 0.08;
  return Array.from({ length: 256 }, (_, i) => {
    const x = (i / 255) * 4;
    return x / (1 + x * shoulder) / (1 / (1 + shoulder));
  });
}

/**
 * `ChromaMap`'s lattice at its real size, which is `MAP_CHROMA` cubed against `MAP_LEVEL`.
 *
 * Off by default so the arms differ by one thing at a time, and worth having because a
 * fitted frame always carries one: without it `finish_chroma` takes the saturation branch
 * and the trilinear the tick spends most of its lookups on never runs.
 */
function chromaMap() {
  const count = 5;
  const levels = 4;
  const reach = 0.45;
  const nodes = [];
  for (let i = 0; i < count * count * levels; i++) {
    // Near-identity with a little hue dependence, so the fetch is not reading one value.
    // Five values a node: the 2x2, then the luma gain, which lands in its own volume.
    nodes.push(1.02, 0.01 * ((i % 3) - 1), -0.01 * ((i % 5) - 2), 0.98, 1.0 + 0.004 * ((i % 7) - 3));
  }
  return {
    nodes,
    chromaCount: count,
    levelCount: levels,
    chromaLow: -reach,
    chromaScale: (count - 1) / (2 * reach),
    levelScale: (levels - 1) / 0.9,
  };
}

/** The shape `tick_bench` uses, so both sides time the same picture. */
function scene(width, height) {
  const samples = new Uint16Array(width * height * 3);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const at = (y * width + x) * 3;
      const noise = (((x * 7919 + y * 104729) % 211) / 211 - 0.5) * 900;
      const ramp = (x / width) * 42000 + 1200;
      const edge = x > width / 2 ? 9000 : 0;
      const patch = y > (height * 3) / 4 && x < width / 4;
      const r = patch ? ramp + edge + 12000 : ramp + edge;
      const g = patch ? ramp * 0.35 : ramp + edge * 0.9;
      const b = patch ? ramp * 0.2 : ramp + edge * 0.8;
      const clamp = (v) => Math.max(0, Math.min(65535, v | 0));
      samples[at] = clamp(r + noise);
      samples[at + 1] = clamp(g + noise * 0.8);
      samples[at + 2] = clamp(b + noise * 1.1);
    }
  }
  return samples;
}

async function main() {
  const adapter = await navigator.gpu?.requestAdapter();
  if (adapter == null) {
    out.textContent = JSON.stringify({ ok: false, error: 'no WebGPU adapter' });
    return;
  }
  // 'timestamp-query' is in here, so a tick that is slow says which pass made it slow.
  const device = await adapter.requestDevice({
    requiredFeatures: tickFeatures(adapter),
    requiredLimits: tickLimits(adapter),
  });
  // A validation error drops the dispatches it applies to, which reads as a very fast
  // tick rather than as a failure. Without this the bench happily reports 2ms for work
  // that never ran.
  let invalid = null;
  device.addEventListener('uncapturederror', (event) => {
    invalid ??= String(event.error?.message ?? event.error);
  });
  const canvas = document.getElementById('stage');
  // The canvas the draw actually fills. Defaults to the frame, which is the 1:1 worst
  // case and what every earlier number here was taken at; `?canvas=2560x1440` is the
  // shape a viewport really has, where the draw no longer scales with the frame.
  const [canvasWidth, canvasHeight] = (query.get('canvas') ?? `${WIDTH}x${HEIGHT}`).split('x').map(Number);
  canvas.width = canvasWidth;
  canvas.height = canvasHeight;
  const context = canvas.getContext('webgpu');
  context.configure({ device, format: 'rgba16float', alphaMode: 'opaque' });

  const header = {
    width: WIDTH,
    height: HEIGHT,
    white: 34000,
    peak: 52000,
    grade: { peakNits: 1000, referenceWhiteNits: 203, whiteQuantile: 0.995 },
    // Recorded by the open, and no longer read per tick: 'image::finish' runs once in
    // 'edit::prepare_bytes' now, so what arrives here is already denoised and sharpened.
    strengths: { luma: 1, chroma: 1, sharpen: 1, defringe: 1 },
    // The peak pass only runs on the matched arm, so it is off unless asked for: without
    // this the tick being timed is the grade with no whole-frame reduction in front of it.
    matched: query.get('matched') === '1',
    colour:
      query.get('matched') === '1'
        ? {
            curves: [toneCurve(0), toneCurve(1), toneCurve(2)],
            matrix: [[1, 0, 0], [0, 1, 0], [0, 0, 1]],
            saturation: 1,
            trustCeiling: 4,
            chroma: query.get('chroma') === '1' ? chromaMap() : null,
          }
        : null,
    sigma: 0.002,
    defocusRed: 0.01,
    defocusBlue: 0.01,
  };

  // The scene is generated outside the timing: it is this file's synthetic stand-in for a
  // decode, and a 9.9M-iteration JS loop counted as "open" hides what the open costs.
  const samples = scene(WIDTH, HEIGHT);
  const built = performance.now();
  const pipeline = new TickPipeline(device, context, header, samples);
  await device.queue.onSubmittedWorkDone();
  const upload = performance.now() - built;

  // One warm run first: the first tick pays for pipeline compilation and the texture
  // upload, neither of which a slider move repeats.
  pipeline.render(0);
  await device.queue.onSubmittedWorkDone();

  const time = async (run) => {
    const taken = [];
    for (let i = 0; i < RUNS; i++) {
      const at = performance.now();
      run(i);
      await device.queue.onSubmittedWorkDone();
      taken.push(Number((performance.now() - at).toFixed(1)));
    }
    return Math.min(...taken);
  };

  const runs = await time((i) => pipeline.render(0.5 + i * 0.1));
  const passes = await pipeline.passMs();

  // The candidate set against a full sample, across the slider's range. Reported as the
  // worst disagreement rather than the sweep, since one number is what would regress.
  let peak = null;
  if (header.matched) {
    // `evs` overrides the sample points, for hunting a peak that misbehaves at a particular
    // slider position rather than across the range.
    const evs = (query.get('evs') ?? '-5,-3,-2,-1,0,1,2,3,5').split(',').map(Number);
    const sweep = await pipeline.peakSweep(evs);
    peak = {
      // The range as well as the disagreement: two peaks that agree because both are the
      // shader's floor of 1 nit would otherwise read as a pass.
      nits: sweep.map((s) => Math.round(s.full)),
      drift: Number(
        Math.max(...sweep.map((s) => Math.abs(s.candidates - s.full) / Math.max(s.full, 1))).toFixed(5),
      ),
    };
  }

  const info = adapter.info ?? {};
  out.textContent = JSON.stringify(
    {
      ok: true,
      adapter: [info.vendor, info.architecture].filter(Boolean).join(' / '),
      size: `${WIDTH}x${HEIGHT}`,
      megapixels: Number(((WIDTH * HEIGHT) / 1e6).toFixed(1)),
      canvas: `${canvasWidth}x${canvasHeight}`,
      matched: header.matched,
      invalid,
      openMs: Number(upload.toFixed(1)),
      tickMs: runs,
      passMs: passes,
      peak,
    },
    null,
    2,
  );
}

main().catch((error) => {
  out.textContent = JSON.stringify({ ok: false, error: String(error) });
});
</script>
</body>
</html>
