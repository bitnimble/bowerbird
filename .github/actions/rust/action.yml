name: rust
description: Rust at `rust-toolchain.toml`'s channel, with `targets`, through the cache.

inputs:
  targets:
    description: What `dtolnay/rust-toolchain` takes, comma-separated.
    default: ''

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        toolchain=$(echo "$version $TARGETS" | git hash-object --stdin)
        echo "key=rustup-${{ github.job }}-$RUNNER_OS-$toolchain" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.rustup/toolchains/${{ steps.key.outputs.version }}-*
          ~/.rustup/update-hashes/${{ steps.key.outputs.version }}-*
        key: ${{ steps.key.outputs.key }}
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.key.outputs.version }}
        targets: ${{ inputs.targets }}
    - if: env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.rustup/toolchains/${{ steps.key.outputs.version }}-*
          ~/.rustup/update-hashes/${{ steps.key.outputs.version }}-*
        key: ${{ steps.key.outputs.key }}
