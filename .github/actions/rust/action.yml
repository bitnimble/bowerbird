name: rust
description: Rust at the workflow's `RUST_VERSION`, with `targets`, through the cache.

inputs:
  targets:
    description: What `dtolnay/rust-toolchain` takes, comma-separated.
    default: ''

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        toolchain=$(echo "$RUST_VERSION $TARGETS" | git hash-object --stdin)
        echo "key=rustup-${{ github.job }}-$RUNNER_OS-$toolchain" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.rustup/toolchains/${{ env.RUST_VERSION }}-*
          ~/.rustup/update-hashes/${{ env.RUST_VERSION }}-*
        key: ${{ steps.key.outputs.key }}
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ inputs.targets }}
    - if: env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.rustup/toolchains/${{ env.RUST_VERSION }}-*
          ~/.rustup/update-hashes/${{ env.RUST_VERSION }}-*
        key: ${{ steps.key.outputs.key }}
