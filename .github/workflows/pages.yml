name: pages

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "landing/**"
  #     # Everything the landing build reads out of web/.
  #     - "web/src/ui/**"
  #     - "web/src/app/global.css"
  #     - "web/public/hdr/**"
  #     - "web/package.json"
  #     - "web/bun.lock"
  #     - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # The landing page imports the app's ui components and global.css, whose
      # own imports (Base UI, react-day-picker) resolve out of web/node_modules.
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun install --frozen-lockfile
        working-directory: landing
      - run: bun run build
        working-directory: landing
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
