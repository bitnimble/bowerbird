name: release

# Distinct release tags cannot share the caches they save; runs on main can.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      only:
        description: 'Build only these, comma-separated: docker, android, macos, windows. Empty builds everything.'
        type: string
        default: ''

# Read, for every job but the one that cuts the release. `publish` widens it for itself:
# a build job that can write to the repository is a build job that can rewrite a tag.
permissions:
  contents: read

env:
  # Where the app's bug report form sends a report (§18.8). Compiled into the web bundle,
  # so every job that builds one needs it. Not a secret: a DSN is write-only ingest, and
  # `web/.env.example` carries the same value for a dev server.
  VITE_SENTRY_DSN: https://80ef14dcd05cf6dc84d567cbbcdef1d2@o4512127315869696.ingest.de.sentry.io/4512127325044816
  SAVE_CACHES: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # What this run builds: everything, unless a manual run named some. A release has no inputs,
  # so it always builds every platform. Its own job because a matrix cannot be narrowed
  # in place - an `include` row that matches no base combination is added back as a new one,
  # and a job's `if` cannot see `matrix`.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      desktop: ${{ steps.pick.outputs.desktop }}
      docker: ${{ steps.pick.outputs.docker }}
      android: ${{ steps.pick.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
      - id: tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="v$(tr -d '[:space:]' < VERSION)"
          tagged=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | sort -k2 | tail -n1 | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$tag is on $tagged, not on the commit this push built ($GITHUB_SHA): push the release commit on its own"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - id: pick
        env:
          ONLY: ${{ inputs.only }}
          # `name` is what `only` matches, short because it is typed and each OS ships one
          # architecture; `platform` is what the release names its files and manifest keys by,
          # which an installed app looks itself up with, so it keeps the architecture.
          #
          # **Linux is paused, and this row is what turns it back on:**
          #   {"name": "linux", "platform": "linux-x86_64", "runs-on": "ubuntu-24.04",
          #    "target": "x86_64-unknown-linux-gnu", "bundles": "deb,appimage"}
          # The shell draws with CEF there and the CLI unions a dependency's features across
          # target tables, so `cef` is hoisted off the Linux `tauri` and written onto the other
          # one, which keeps `wry`. Both runtimes on is the silent mismatch `src-tauri/Cargo.toml`
          # describes, and it reaches macOS and Windows rather than Linux. Nobody runs Bowerbird
          # on Linux yet - the desktop arm was built for completeness - so it waits until the
          # shell draws with one runtime everywhere or the manifest can state two without the
          # CLI merging them.
          #
          # macOS asks for `app` as well as `dmg`: the payload ships the `.app` itself, and asked
          # for a `dmg` alone the bundler deletes the `.app` it made one from.
          DESKTOP: |
            [
              {"name": "macos", "platform": "macos-arm64", "runs-on": "macos-14", "target": "aarch64-apple-darwin", "bundles": "app,dmg"},
              {"name": "windows", "platform": "windows-x86_64", "runs-on": "windows-latest", "target": "x86_64-pc-windows-msvc", "bundles": "nsis"}
            ]
        run: |
          set -eu
          only=$(tr -d ' ' <<<"$ONLY")
          # A misspelt name would otherwise build nothing and pass.
          known="docker android $(jq -r 'map(.name) | join(" ")' <<<"$DESKTOP")"
          for name in ${only//,/ }; do
            case " $known " in
              *" $name "*) ;;
              *) echo "::error::$name is not something this workflow builds: $known"; exit 1 ;;
            esac
          done
          wanted() { [ -z "$only" ] || [[ ",$only," == *",$1,"* ]]; }
          echo "docker=$(wanted docker && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "android=$(wanted android && echo true || echo false)" >> "$GITHUB_OUTPUT"
          desktop=$(jq -c --arg only "$only" \
            '($only | split(",") | map(select(. != ""))) as $names
             | map(select(($names | length) == 0 or (.name as $n | $names | index($n) != null)))' \
            <<<"$DESKTOP")
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "building: docker=$(wanted docker && echo yes || echo no) android=$(wanted android && echo yes || echo no) desktop=$desktop"

  platform-tests:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lfs
        with:
          include: assets/reference_frame.ARW
      - uses: ./.github/actions/bun-deps
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHES == 'true' }}
          workspaces: |
            native/updater
            native/lensdb
      - run: bun run test:platform

  docker:
    needs: [plan, platform-tests]
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      # `rawler` is a path dependency on native/vendor/dnglab, so a checkout without
      # the submodule is a cargo build that fails on a directory that is not there.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/lfs
        with:
          include: assets/reference_frame.ARW

      # A runner has ~14GB free, and the native stage's target dirs are ~3GB that the cache
      # below holds twice while it saves. The toolchains this image does not use are what
      # the margin comes out of.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          df -h /

      - id: buildx
        uses: docker/setup-buildx-action@v4

      # The image's cache mounts - cargo's registry and target dirs, the pinned trees, bun's and
      # apt's downloads - which are in no layer the registry cache below carries. Keyed on what
      # fills them, restored from the last one: a dependency or a pin moving fetches that one
      # rather than all of them. On `main` the full action, whose post step saves after the cache
      # dance's has extracted.
      - name: The image's cache mounts, from last time (saved after)
        if: env.SAVE_CACHES == 'true'
        id: mounts-cache-rw
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/docker-mounts
          key: docker-mounts-${{ hashFiles('Dockerfile', 'native/rawshim/Cargo.lock', 'bun.lock', 'web/bun.lock', 'scripts/get-*.ts', 'scripts/pinned.ts', 'scripts/vcpkg.ts', 'native/rawshim/vcpkg/**') }}
          restore-keys: docker-mounts-
      - name: The image's cache mounts, from last time
        if: env.SAVE_CACHES != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/docker-mounts
          key: docker-mounts-${{ hashFiles('Dockerfile', 'native/rawshim/Cargo.lock', 'bun.lock', 'web/bun.lock', 'scripts/get-*.ts', 'scripts/pinned.ts', 'scripts/vcpkg.ts', 'native/rawshim/vcpkg/**') }}
          restore-keys: docker-mounts-
      # Outside the checkout, which is the build context and would otherwise send all of it.
      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/cache-dance
          cache-map: |
            {
              "${{ runner.temp }}/docker-mounts/cargo-registry": { "target": "/root/.cargo/registry", "id": "bowerbird-cargo-registry" },
              "${{ runner.temp }}/docker-mounts/native-target": { "target": "/build/target", "id": "bowerbird-native-target" },
              "${{ runner.temp }}/docker-mounts/swiftshader": { "target": "/root/.cache", "id": "bowerbird-swiftshader" },
              "${{ runner.temp }}/docker-mounts/environments": { "target": "/root/.cache", "id": "bowerbird-environments" },
              "${{ runner.temp }}/docker-mounts/slangc": { "target": "/root/.cache", "id": "bowerbird-slangc" },
              "${{ runner.temp }}/docker-mounts/pmrid": { "target": "/root/.cache", "id": "bowerbird-pmrid" },
              "${{ runner.temp }}/docker-mounts/codecs": { "target": "/root/.cache", "id": "bowerbird-codecs" },
              "${{ runner.temp }}/docker-mounts/bun": { "target": "/root/.bun/install/cache", "id": "bowerbird-bun" },
              "${{ runner.temp }}/docker-mounts/apt-archives": { "target": "/var/cache/apt", "id": "bowerbird-apt-archives" },
              "${{ runner.temp }}/docker-mounts/apt-lists": { "target": "/var/lib/apt/lists", "id": "bowerbird-apt-lists" }
            }
          skip-extraction: ${{ env.SAVE_CACHES != 'true' || steps.mounts-cache-rw.outputs.cache-hit == 'true' }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also where the image's OCI labels come from - `source`, `description` and
      # `licenses`, off this repository. The Dockerfile writes none of them, so this is what
      # attaches the GHCR package to the repo and gives it its README and visibility.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.tag != '' && !contains(needs.plan.outputs.tag, '-') }}
            type=sha

      - uses: ./.github/actions/wasm-pkg
      - uses: docker/build-push-action@v7
        with:
          context: .
          # The `wasm` job's package in place of the image's own stage, which would build the
          # same sources a second time.
          build-contexts: wasm=native/rawshim/pkg
          platforms: linux/amd64
          push: true
          # The web bundle is built inside the image, where the workflow's environment
          # does not reach.
          build-args: |
            VITE_SENTRY_DSN=${{ env.VITE_SENTRY_DSN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The registry, not `type=gha`: the repository's 10GB of Actions cache is mostly Rust, and
          # its least-recently-used eviction takes these layers first.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  # The editor's decoder, which every web build imports by path. Wasm, so one build serves
  # every platform, and `build:wasm` in an app job finds it already built from the same sources.
  wasm:
    needs: [plan, platform-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/bun-deps
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHES == 'true' }}
          workspaces: native/rawshim
      - name: The pinned trees, from last time
        id: pinned-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bowerbird
          key: pinned-${{ runner.os }}-wasm-${{ hashFiles('scripts/get-*.ts', 'scripts/pinned.ts', 'scripts/vcpkg.ts', 'native/rawshim/vcpkg/**') }}
          restore-keys: pinned-${{ runner.os }}-wasm-
      - run: bun run get:shell
      - if: env.SAVE_CACHES == 'true' && steps.pinned-cache.outputs.cache-hit != 'true'
        run: bun run scripts/prune-pinned.ts
      - if: env.SAVE_CACHES == 'true' && steps.pinned-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bowerbird
          key: ${{ steps.pinned-cache.outputs.cache-primary-key }}
      - name: wasm-pack and wasm-bindgen, from last time
        id: wasm-tools-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /tmp/bunx-*-wasm-pack@*
            ~/.cache/.wasm-pack
          key: wasm-tools-${{ hashFiles('scripts/build-wasm.ts', 'native/rawshim/Cargo.lock') }}
          restore-keys: wasm-tools-
      - run: bun run build:wasm
      - if: env.SAVE_CACHES == 'true' && steps.wasm-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /tmp/bunx-*-wasm-pack@*
            ~/.cache/.wasm-pack
          key: ${{ steps.wasm-tools-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v6
        with:
          name: wasm-pkg
          path: native/rawshim/pkg/

  # One row per platform, from `plan`, which is where the rows are written.
  desktop:
    needs: [plan, platform-tests]
    if: needs.plan.outputs.desktop != '[]'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/bun-deps
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}
      # `cache-on-failure`, because the default saves only from a job that passed, and a job
      # that fails in its last minute has still compiled every dependency - which the next run
      # then compiles again, for as many runs as it takes to get one green.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHES == 'true' }}
          workspaces: |
            native/rawshim
            src-tauri

      # What the Dockerfile's `codecs` stage installs, which is what vcpkg does not fetch for
      # itself on Linux, plus libclang-dev for bindgen. The webkit and appindicator packages
      # are Tauri's own bundling dependencies rather than this app's - the Linux build runs on
      # CEF (`src-tauri/Cargo.toml`).
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git nasm pkg-config python3 zip unzip libclang-dev \
            libgtk-3-dev librsvg2-dev patchelf desktop-file-utils fuse3 libfuse2t64

      # bindgen runs its own clang and finds it by this rather than by PATH. The runner image
      # ships LLVM; naming the directory is all that is missing.
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
        shell: bash

      # The codecs are nine libraries built from source, which is most of the time this job
      # spends before it compiles anything of ours.
      - name: The pinned trees, from last time
        id: pinned-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bowerbird
          key: pinned-${{ runner.os }}-desktop-${{ hashFiles('scripts/get-*.ts', 'scripts/pinned.ts', 'scripts/vcpkg.ts', 'native/rawshim/vcpkg/**') }}
          restore-keys: pinned-${{ runner.os }}-desktop-

      # vcpkg's archive of each port it built, for when the trees above miss: a recipe change then
      # rebuilds only the ports it touched. vcpkg checks each against the ABI hash of the port, the
      # triplet and the compiler before using it, so the key only decides when a new entry is
      # written: a stale one is a per-port rebuild, never a wrong library.
      - name: vcpkg's builds, from last time
        if: steps.pinned-cache.outputs.cache-hit != 'true'
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/rawshim/vcpkg/**', 'scripts/vcpkg.ts') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # The pinned compiler and the pinned codecs, fetched through the same scripts a
      # development machine runs so the version is stated once (`scripts/vcpkg.ts`).
      - run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-archives"
          bun run get:all
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-archives,readwrite
        shell: bash
      # Both saved as soon as they exist, rather than by the post step, which only runs for a
      # job that passed.
      - if: env.SAVE_CACHES == 'true' && steps.pinned-cache.outputs.cache-hit != 'true'
        run: bun run scripts/prune-pinned.ts
      - if: env.SAVE_CACHES == 'true' && steps.pinned-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bowerbird
          key: ${{ steps.pinned-cache.outputs.cache-primary-key }}
      - if: env.SAVE_CACHES == 'true' && steps.pinned-cache.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/rawshim/vcpkg/**', 'scripts/vcpkg.ts') }}

      - name: The bundler's tools, from last time
        if: runner.os == 'Windows'
        id: bundler-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/tauri
          key: bundler-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bundler-${{ runner.os }}-

      - uses: ./.github/actions/wasm-pkg
      - name: Build the app
        run: bun run build:app --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        shell: bash
      - if: runner.os == 'Windows' && env.SAVE_CACHES == 'true' && steps.bundler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/tauri
          key: ${{ steps.bundler-cache.outputs.cache-primary-key }}

      # Renamed to `Bowerbird_<version>_<platform><kind>`: the bundler names its files by
      # architecture alone (`_aarch64.dmg`, `_x64-setup.exe`), which says nothing about the OS
      # and spells it its own way.
      - name: Assemble the payload and collect the installer
        run: |
          set -eu
          bun run scripts/build-payload.ts --target ${{ matrix.target }} --out dist/payload
          version=$(tr -d '[:space:]' < VERSION)
          dest=dist/installer/${{ matrix.platform }}
          mkdir -p "$dest"
          # Matched on the version too, so an installer an earlier build left in the cached
          # target directory cannot be renamed over this one.
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f -name "*_${version}_*" \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*-setup.exe' \) |
          while IFS= read -r file; do
            case "$file" in
              *-setup.exe) kind=-setup.exe ;;
              *) kind=".${file##*.}" ;;
            esac
            cp "$file" "$dest/Bowerbird_${version}_${{ matrix.platform }}$kind"
          done
          ls "$dest"
        shell: bash

      # Two artifacts, each holding `<platform>/<file>`, so one can be fetched without the other and
      # `publish` still merges both into `dist/<platform>/`.
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}-installer
          path: dist/installer/
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}-payload
          path: dist/payload/

  # Shell only: `rawshim` without `renditions` links no C at all, and with it would want the
  # codecs `get:codecs` builds, for an Android triplet it does not name.
  #
  # It carries no server either, there being no Bun runtime for Android to carry, so
  # `tauri.android.conf.json` clears the `externalBin` and the resources the desktop config
  # names - a build otherwise stops at a sidecar for a triple nothing builds one for. The app
  # points at a hosted library instead, which `lib.rs` already treats as the ordinary case.
  android:
    needs: [plan, platform-tests]
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/bun-deps
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Tauri CLI adds all 4 itself; listed so the cached toolchain holds them.
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      # `src-tauri` alone: `rawshim` is its path dependency, built into its target directory.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHES == 'true' }}
          workspaces: src-tauri

      - run: echo "NDK_VERSION=$(tr -d '[:space:]' < .android-ndk-version)" >> "$GITHUB_ENV"
      - name: The NDK, from last time
        id: ndk-cache
        uses: actions/cache/restore@v6
        with:
          # = $ANDROID_HOME; runner env is not in the env context
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}
      - if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"'
      - if: env.SAVE_CACHES == 'true' && steps.ndk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: The pinned trees, from last time
        id: pinned-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bowerbird
          key: pinned-${{ runner.os }}-android-${{ hashFiles('scripts/get-*.ts', 'scripts/pinned.ts', 'scripts/vcpkg.ts', 'native/rawshim/vcpkg/**') }}
          restore-keys: pinned-${{ runner.os }}-android-
      - run: bun run get:shell
      - if: env.SAVE_CACHES == 'true' && steps.pinned-cache.outputs.cache-hit != 'true'
        run: bun run scripts/prune-pinned.ts
      - if: env.SAVE_CACHES == 'true' && steps.pinned-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bowerbird
          key: ${{ steps.pinned-cache.outputs.cache-primary-key }}

      # The Gradle the generated project names and the plugins and libraries it resolves, which
      # `tauri android init` writes from the Tauri revision.
      - name: Gradle, from last time
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/tauri.android.conf.json') }}
          restore-keys: gradle-
      - uses: ./.github/actions/wasm-pkg
      - run: bun run build:app --target aarch64-linux-android
      - if: env.SAVE_CACHES == 'true' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # Gradle leaves the release APK unsigned, and Android will not install one. With a
      # keystore in the repository's secrets this signs it; without, the unsigned APK is
      # published as it is, for somebody to sign themselves.
      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          mkdir -p dist/android-arm64
          apk=$(find src-tauri/gen/android -name '*release*.apk' | head -n1)
          version=$(tr -d '[:space:]' < VERSION)
          out="dist/android-arm64/Bowerbird_${version}_android-arm64.apk"
          if [ -z "${KEYSTORE:-}" ]; then
            echo "no ANDROID_KEYSTORE_BASE64 secret: publishing the unsigned APK"
            cp "$apk" "$out"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > /tmp/release.jks
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -n1)
          "$tools/apksigner" sign --ks /tmp/release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --out "$out" "$apk"
          rm -f /tmp/release.jks

      - uses: actions/upload-artifact@v6
        with:
          name: dist-android-arm64-installer
          path: dist/

  # After the jobs that save, which do so in their post steps: the repository holds 10GB of cache
  # and evicts the least recently used, and the entries that would push out are the live ones.
  prune-caches:
    needs: [docker, wasm, desktop, android]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/prune-caches.ts
            .bun-version
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun run scripts/prune-caches.ts ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # One release, made once everything that could fail has. The manifest is written from
  # the files that are about to be uploaded rather than from a list somebody maintains,
  # so a platform whose build failed is simply absent from it - and an install of that
  # platform is told there is nothing for it rather than handed a 404.
  publish:
    needs: [plan, platform-tests, docker, desktop, android]
    # A platform that failed to build should not hold the release back; what it must not
    # do is appear in the manifest, which it cannot, having uploaded nothing.
    if: ${{ always() && needs.platform-tests.result == 'success' && needs.plan.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # manifest writer imports the zod schemas
      - uses: ./.github/actions/bun-deps
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - run: bun run scripts/write-release-manifest.ts --dist dist ${{ needs.docker.result == 'success' && format('--image-repo ghcr.io/{0}', github.repository) || '' }}
      - run: jq -r --arg tag "$TAG" '.[$tag] // "Bug fixes and performance improvements"' changelog.json > "$RUNNER_TEMP/changelog.md"
        env:
          TAG: ${{ needs.plan.outputs.tag }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # The description of this release is the changelog the app shows (DESIGN §23.1).
          body_path: ${{ runner.temp }}/changelog.md
          files: |
            dist/release.yml
            dist/*/*
