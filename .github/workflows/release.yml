name: release

# A tag push builds every distributable and cuts a release; the button builds every
# distributable without stamping a version or cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Build only these, comma-separated: docker, android, macos, windows. Empty builds everything."
        type: string
        default: ""

# Read, for every job but the one that cuts the release. `publish` widens it for itself:
# a build job that can write to the repository is a build job that can rewrite a tag.
permissions:
  contents: read

env:
  # Empty unless a tag push started the run; release-only steps key off it.
  TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
  # Where the app's bug report form sends a report (§18.8). Compiled into the web bundle,
  # so every job that builds one needs it. Not a secret: a DSN is write-only ingest, and
  # `web/.env.example` carries the same value for a dev server.
  VITE_SENTRY_DSN: https://80ef14dcd05cf6dc84d567cbbcdef1d2@o4512127315869696.ingest.de.sentry.io/4512127325044816

jobs:
  # What this run builds: everything, unless a manual run named some. A tag push has no inputs,
  # so a release always builds every platform. Its own job because a matrix cannot be narrowed
  # in place - an `include` row that matches no base combination is added back as a new one,
  # and a job's `if` cannot see `matrix`.
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.pick.outputs.desktop }}
      docker: ${{ steps.pick.outputs.docker }}
      android: ${{ steps.pick.outputs.android }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
          # `name` is what `only` matches, short because it is typed and each OS ships one
          # architecture; `platform` is what the release names its files and manifest keys by,
          # which an installed app looks itself up with, so it keeps the architecture.
          #
          # **Linux is paused, and this row is what turns it back on:**
          #   {"name": "linux", "platform": "linux-x86_64", "runs-on": "ubuntu-24.04",
          #    "target": "x86_64-unknown-linux-gnu", "bundles": "deb,appimage"}
          # The shell draws with CEF there and the CLI unions a dependency's features across
          # target tables, so `cef` is hoisted off the Linux `tauri` and written onto the other
          # one, which keeps `wry`. Both runtimes on is the silent mismatch `src-tauri/Cargo.toml`
          # describes, and it reaches macOS and Windows rather than Linux. Nobody runs Bowerbird
          # on Linux yet - the desktop arm was built for completeness - so it waits until the
          # shell draws with one runtime everywhere or the manifest can state two without the
          # CLI merging them.
          #
          # macOS asks for `app` as well as `dmg`: the payload ships the `.app` itself, and asked
          # for a `dmg` alone the bundler deletes the `.app` it made one from.
          DESKTOP: |
            [
              {"name": "macos", "platform": "macos-aarch64", "runs-on": "macos-14", "target": "aarch64-apple-darwin", "bundles": "app,dmg"},
              {"name": "windows", "platform": "windows-x86_64", "runs-on": "windows-latest", "target": "x86_64-pc-windows-msvc", "bundles": "nsis"}
            ]
        run: |
          set -eu
          only=$(tr -d ' ' <<<"$ONLY")
          # A misspelt name would otherwise build nothing and pass.
          known="docker android $(jq -r 'map(.name) | join(" ")' <<<"$DESKTOP")"
          for name in ${only//,/ }; do
            case " $known " in
              *" $name "*) ;;
              *) echo "::error::$name is not something this workflow builds: $known"; exit 1 ;;
            esac
          done
          wanted() { [ -z "$only" ] || [[ ",$only," == *",$1,"* ]]; }
          echo "docker=$(wanted docker && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "android=$(wanted android && echo true || echo false)" >> "$GITHUB_OUTPUT"
          desktop=$(jq -c --arg only "$only" \
            '($only | split(",") | map(select(. != ""))) as $names
             | map(select(($names | length) == 0 or (.name as $n | $names | index($n) != null)))' \
            <<<"$DESKTOP")
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "building: docker=$(wanted docker && echo yes || echo no) android=$(wanted android && echo yes || echo no) desktop=$desktop"

  # The container, and the payload an installed one replaces itself with. Both come out
  # of the same image, which is the point: what a running container updates to is exactly
  # what a fresh `docker pull` would have given it.
  docker:
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # `rawler` is a path dependency on native/vendor/dnglab, so a checkout without
      # the submodule is a cargo build that fails on a directory that is not there.
      - uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive

      # A runner has ~14GB free and the Rust stage peaks near 3. The toolchains this
      # image does not use are what the margin comes out of.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          df -h /

      - uses: oven-sh/setup-bun@v2
      - name: Stamp the version the tag names
        if: env.TAG != ''
        run: bun run scripts/set-version.ts "$TAG"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also where the image's OCI labels come from - `source`, `description` and
      # `licenses`, off this repository. The Dockerfile writes none of them, so this is what
      # attaches the GHCR package to the repo and gives it its README and visibility.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` needs no line: the default flavour attaches it to whichever
          # semver tag is highest. A manual run publishes only its commit, even when
          # the button targets a tag.
          tags: |
            type=semver,pattern={{version}},enable=${{ env.TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.TAG != '' }}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only, and the entrypoint is why: the image ships three rawshim
          # builds picked between by x86 instruction set, and the Rust stage names
          # those levels. An arm64 build has no target-cpu to give it.
          platforms: linux/amd64
          push: true
          load: true
          # The web bundle is built inside the image, where the workflow's environment
          # does not reach.
          build-args: |
            VITE_SENTRY_DSN=${{ env.VITE_SENTRY_DSN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Taken out of the image rather than assembled beside it, so the tarball and the
      # image cannot be built from different trees - which is the one way an in-place
      # update could land a container on something `docker pull` would never produce.
      - name: Take the payload out of the image
        if: env.TAG != ''
        run: |
          set -eu
          mkdir -p dist/docker-x86_64
          image=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          # `load: true` above is what normally puts it in the daemon, and whether buildx
          # can load and push in one invocation depends on its driver and its version - so
          # this asks rather than assumes, and fetches what was just pushed if it has to.
          docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
          id=$(docker create "$image")
          docker cp "$id:/app/payload" ./payload
          docker rm "$id"
          tar -czf dist/docker-x86_64/bowerbird-payload-docker-x86_64.tar.gz -C ./payload .

      - uses: actions/upload-artifact@v6
        if: env.TAG != ''
        with:
          name: dist-docker-x86_64-payload
          path: dist/

  # One row per platform, from `plan`, which is where the rows are written.
  desktop:
    needs: plan
    if: needs.plan.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      # `cache-on-failure`, because the default saves only from a job that passed, and a job
      # that fails in its last minute has still compiled every dependency - which the next run
      # then compiles again, for as many runs as it takes to get one green.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            native/rawshim
            src-tauri
            native/launcher

      # What the Dockerfile's `codecs` stage installs, which is what vcpkg does not fetch for
      # itself on Linux, plus libclang-dev for bindgen. The webkit and appindicator packages
      # are Tauri's own bundling dependencies rather than this app's - the Linux build runs on
      # CEF (`src-tauri/Cargo.toml`).
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git nasm pkg-config python3 zip unzip libclang-dev \
            libgtk-3-dev librsvg2-dev patchelf desktop-file-utils fuse3 libfuse2t64

      # bindgen runs its own clang and finds it by this rather than by PATH. The runner image
      # ships LLVM; naming the directory is all that is missing.
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
        shell: bash

      # Two installs, because `web` is its own package with its own lockfile: vite, React
      # and the plugins are only in that one, and `tauri build` runs the web build.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web

      # The codecs are nine libraries built from source, which is most of the time this job
      # spends before it compiles anything of ours. A tree is named by the hash of its recipe
      # (`scripts/pinned.ts`), so the getters and the vcpkg manifest are the whole of the key: a
      # version or a flag moving misses the cache and rebuilds, which is exactly what it should do.
      - name: The pinned trees, from last time
        id: pinned-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bowerbird
          key: pinned-${{ runner.os }}-${{ hashFiles('scripts/get-*.ts', 'scripts/pinned.ts', 'scripts/vcpkg.ts', 'native/rawshim/vcpkg/**') }}

      # vcpkg's archive of each port it built, for when the trees above miss: a recipe change then
      # rebuilds only the ports it touched. vcpkg checks each against the ABI hash of the port, the
      # triplet and the compiler before using it, so the key only decides when a new entry is
      # written: a stale one is a per-port rebuild, never a wrong library.
      - name: vcpkg's builds, from last time
        if: steps.pinned-cache.outputs.cache-hit != 'true'
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/rawshim/vcpkg/**', 'scripts/vcpkg.ts') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # The pinned compiler and the pinned codecs, fetched through the same scripts a
      # development machine runs so the version is stated once (`scripts/vcpkg.ts`).
      - run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-archives"
          bun run get:all
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-archives,readwrite
        shell: bash
      # Both saved as soon as they exist, rather than by the post step, which only runs for a
      # job that passed.
      - if: steps.pinned-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bowerbird
          key: pinned-${{ runner.os }}-${{ hashFiles('scripts/get-*.ts', 'scripts/pinned.ts', 'scripts/vcpkg.ts', 'native/rawshim/vcpkg/**') }}
      - if: steps.pinned-cache.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/rawshim/vcpkg/**', 'scripts/vcpkg.ts') }}

      - name: Stamp the version the tag names
        if: env.TAG != ''
        run: bun run scripts/set-version.ts "$TAG"
        shell: bash

      # The editor's decoder, which the web build imports by path - so it has to exist
      # before vite resolves anything.
      - run: bun run build:wasm
        shell: bash

      # The server the app carries, and the pixel library behind it. One triple on every
      # platform: the shell, the library and the Bun runtime beside them are all the same build.
      - name: The bundled server
        env:
          # Here, not in rawshim's release profile: `test:bench` builds that profile too, and a profiler wants the symbols.
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          set -eu
          bun run build:native:release --target ${{ matrix.target }}
          bun run build:sidecar --target ${{ matrix.target }}
        shell: bash

      - name: Build the app
        run: bun run build:app --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        shell: bash

      - name: Assemble the payload and collect the installer
        run: |
          set -eu
          bun run scripts/build-payload.ts --target ${{ matrix.target }} --out dist/payload
          mkdir -p dist/installer/${{ matrix.platform }}
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*-setup.exe' \) \
            -exec cp {} dist/installer/${{ matrix.platform }}/ \;
        shell: bash

      # Two artifacts, each holding `<platform>/<file>`, so one can be fetched without the other and
      # `publish` still merges both into `dist/<platform>/`.
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}-installer
          path: dist/installer/
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}-payload
          path: dist/payload/

  # Shell only: `rawshim` without `renditions` links no C at all, and with it would want the
  # codecs `get:codecs` builds, for an Android triplet it does not name.
  #
  # It carries no server either, there being no Bun runtime for Android to carry, so
  # `tauri.android.conf.json` clears the `externalBin` and the resources the desktop config
  # names - a build otherwise stops at a sidecar for a triple nothing builds one for. The app
  # points at a hosted library instead, which `lib.rs` already treats as the ordinary case.
  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: native/rawshim,src-tauri

      - run: sdkmanager --install "ndk;27.2.12479018"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: The pinned trees, from last time
        id: pinned-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bowerbird
          key: pinned-${{ runner.os }}-android-${{ hashFiles('scripts/get-*.ts', 'scripts/pinned.ts', 'scripts/vcpkg.ts', 'native/rawshim/vcpkg/**') }}
      - run: bun run get:shell
      - if: steps.pinned-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bowerbird
          key: pinned-${{ runner.os }}-android-${{ hashFiles('scripts/get-*.ts', 'scripts/pinned.ts', 'scripts/vcpkg.ts', 'native/rawshim/vcpkg/**') }}
      - name: Stamp the version the tag names
        if: env.TAG != ''
        run: bun run scripts/set-version.ts "$TAG"
      - run: bun run build:wasm
      # `NDK_HOME` is left to the script, which takes the highest under `$ANDROID_HOME/ndk` -
      # the one installed above, there being only one.
      - run: bun run android:build

      # Gradle leaves the release APK unsigned, and Android will not install one. With a
      # keystore in the repository's secrets this signs it; without, the unsigned APK is
      # published as it is, for somebody to sign themselves.
      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          mkdir -p dist/android-aarch64
          apk=$(find src-tauri/gen/android -name '*release*.apk' | head -n1)
          # The bare version, like every bundler-produced installer beside it: this is the
          # one filename the build does not choose, so it is the one that can drift.
          version="${TAG#v}"
          out="dist/android-aarch64/Bowerbird_${version:-manual}.apk"
          if [ -z "${KEYSTORE:-}" ]; then
            echo "no ANDROID_KEYSTORE_BASE64 secret: publishing the unsigned APK"
            cp "$apk" "$out"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > /tmp/release.jks
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -n1)
          "$tools/apksigner" sign --ks /tmp/release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --out "$out" "$apk"
          rm -f /tmp/release.jks

      - uses: actions/upload-artifact@v6
        with:
          name: dist-android-aarch64-installer
          path: dist/

  # One release, made once everything that could fail has. The manifest is written from
  # the files that are about to be uploaded rather than from a list somebody maintains,
  # so a platform whose build failed is simply absent from it - and an install of that
  # platform is told there is nothing for it rather than handed a 404.
  publish:
    needs: [docker, desktop, android]
    # A platform that failed to build should not hold the release back; what it must not
    # do is appear in the manifest, which it cannot, having uploaded nothing.
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # The manifest writer reads the schemas, and the schemas are zod: without this it is
      # a module resolution failure at the last step of a release that otherwise worked.
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      # The repository, not the whole reference: the script pairs it with the version it
      # already stripped the `v` off, which is the tag `docker/metadata-action` pushed.
      - run: bun run scripts/write-release-manifest.ts --dist dist --tag "${{ github.ref_name }}" --image-repo "ghcr.io/${{ github.repository }}"
      - uses: softprops/action-gh-release@v3
        with:
          # The description of this release is the changelog the app shows (DESIGN §23.1),
          # so it is generated rather than left empty: an update nobody can read the
          # reason for is an update nobody installs.
          generate_release_notes: true
          files: |
            dist/release.yml
            dist/*/*
