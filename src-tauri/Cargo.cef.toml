# The Linux build's runtime, pinned to Tauri's `feat/cef` branch.
#
# WebKitGTK is built with `ENABLE_WEBGPU` off (`docs/raw-edit-gpu.md` §10.1), so the
# editor's tick cannot run in the stock Linux webview at all. CEF is a bundled Chromium,
# which puts Linux on the same engine as WebView2 and makes the canvas path reach every
# platform (`docs/tauri-cef-evaluation.md` §4.4).
#
# Kept beside the real manifest rather than in it, for one blocking reason and two lesser
# ones. The blocker: `tauri-plugin-wdio` and `tauri-plugin-wdio-webdriver` do not compile
# against this branch - `tauri-utils::acl::build::define_global_scope_schema` changed
# signature - so a CEF build cannot run the desktop e2e suite at all, and the e2e suite is
# how the shell is tested. The lesser ones: the branch is not on crates.io, its tip moves,
# and a checkout that cannot reach GitHub should still build the app.
#
# **Measured working**, 2026-08-04, on this branch at 4af26a3. The app builds, links
# `libcef.so`, and the webview reports `navigator.gpu` with a real adapter (`amd / rdna-2`)
# and accepts `toneMapping: { mode: 'extended' }` - which is precisely what WebKitGTK
# cannot do, and therefore the whole reason Linux would take CEF.
#
# Apply with
#   cp src-tauri/Cargo.cef.toml src-tauri/Cargo.toml
# and expect the first build to fetch a few hundred megabytes of CEF. On a headless box it
# also wants `--no-sandbox`, and `libxkbcommon-x11` / `libxcb-xkb` present.
[package]
name = "app"
version = "0.1.0"
description = "Bowerbird desktop shell"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mirrors the real manifest, which is the whole contract of this file: it is copied over
# `Cargo.toml`, so anything only that one carries is absent from a CEF build. `reqwest` is
# what the proxy is written against, and `default-features = false` keeps `rawshim` down to
# LibRaw rather than relinking lensfun and libavif for an open that never asks for them.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rawshim = { path = "../native/rawshim", default-features = false }

# `default-features = false` is load-bearing. Nothing emits a compile_error when both
# runtimes are on: build.rs would report `cef` (so the build takes the CEF manifest and
# rpath) while `Builder::default()` still resolves to `Builder<Wry>`, because
# `#[default_runtime(crate::Wry, wry)]` keeps defaulting the generic to Wry whenever the
# `wry` feature is present. A silently mismatched build.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef", default-features = false, features = [
  "cef",
] }

[dependencies.tauri-plugin-wdio]
version = "1"
optional = true

[dependencies.tauri-plugin-wdio-webdriver]
version = "1"
optional = true

[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

# The same profile as the real manifest, and for the same reasons: cargo reads profiles from
# the top-level package only, so a CEF build inherits nothing from `rawshim` and gets cargo's
# defaults - wrapping arithmetic through the decode, no cross-crate inlining, and a symbol
# table larger than the code.
[profile.release]
overflow-checks = true
strip = "symbols"
lto = "fat"
codegen-units = 1

# The wdio plugins depend on `tauri` from crates.io, and `tauri` sets `links = "Tauri"`, so
# a graph carrying both it and the git one does not resolve at all. Patching every crate in
# the family onto the branch is what makes the two agree; patching only `tauri` moves the
# conflict down to `tauri-runtime`.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
