[package]
name = "app"
version = "0.1.0"
description = "Bowerbird desktop shell"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# The shell proxies for the hosted server, so it needs a client. `rustls` rather than the
# system TLS so a bundled build carries its own and does not want OpenSSL on the box.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The event stream's reconnect backoff. Already in the tree - `tauri` runs on it - and named
# here only because `tauri::async_runtime` re-exports the channel and lock types but not the
# timer. `Response::chunk` is not feature-gated, so reading the stream itself needs nothing.
tokio = { version = "1", features = ["time"] }
# The editor's open, in process: the shell fetches the RAW and prepares it here, because
# the RAW is tens of megabytes where the frame it decodes to is hundreds.
#
# Without `renditions`, so it links LibRaw and nothing else. The editor's open never
# touches lensfun or libavif - its geometry is the spline the camera recorded or a fit
# against the embedded JPEG, and its display transform is the client's GPU - so this is
# three fewer C libraries on every platform, and the difference between an Android build
# being possible and not.
rawshim = { path = "../native/rawshim", default-features = false }

# WebdriverIO desktop e2e: the in-app Execute API and the embedded WebDriver server.
# Optional and behind a feature so they never ride a shipped build.
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.release]
# `rawshim` asks for this in its own manifest and does not get it: cargo reads profiles
# from the top-level package only, so a dependency's are ignored. Without it here the
# shells run the decode with wrapping arithmetic where the server does not - and an index
# product that wraps is a picture that comes out wrong rather than a crash.
overflow-checks = true
# The symbol table is 9MB of the Windows binary and 3MB of the macOS one, for builds
# nothing debugs remotely.
strip = "symbols"
# Cargo's release defaults are `lto = false` and `codegen-units = 16`, which is
# per-crate optimisation and sixteen independent units inside each one. A shipped build
# has no reason to leave either there: the whole program is available, and the tick's hot
# path crosses crate boundaries into `rawshim`.
lto = "fat"
codegen-units = 1
