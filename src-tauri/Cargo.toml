[package]
name = "app"
version = "0.0.0"
description = "Bowerbird desktop shell"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# The empty list is not noise: the CLI rewrites this file before every build and writes one in if
# it is not there, so stating it is what keeps a build from leaving the tree dirty.
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "1212c22d89c5136acc9d349b75cc6bfd36ede10c", features = [] }

[dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "1212c22d89c5136acc9d349b75cc6bfd36ede10c", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shell proxies for the hosted server, so it needs a client. `rustls` rather than the
# system TLS so a bundled build carries its own and does not want OpenSSL on the box.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The event stream's reconnect backoff. Already in the tree - `tauri` runs on it - and named
# here only because `tauri::async_runtime` re-exports the channel and lock types but not the
# timer. `Response::chunk` is not feature-gated, so reading the stream itself needs nothing.
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Starting the app, so that the app can be replaced while it is not running (DESIGN §23.3).
# `main.rs` is the supervisor before it is the app; the container's PID 1 is this crate's
# own binary, so the two hosts share one implementation of what a version is.
launcher = { path = "../native/launcher" }
getrandom = "0.3"

# The folder an export is written into (§10.5.1), asked for in the reader's own file manager.
# `tauri-plugin-dialog` is what would normally provide this and cannot: it depends on `tauri`
# from crates.io where this build takes it from git, which cargo does not unify - two `tauri`
# crates, and every `AppHandle` the wrong type. So the crate the plugin wraps, directly.
#
# The predicate is what tauri's own `desktop` cfg expands to, and `export.rs` gates on that
# cfg - the two have to keep agreeing, because rfd has no backend for Android and does not
# compile there. The portal rather than GTK on Linux, since the CEF build carries no GTK.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# The application chooser "Open in…" shows (`open_with.rs`), one table per platform.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Com", "Win32_UI_Shell"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSArray"] }
# The executable an updated bundle names in its Info.plist (`main.rs`). Already in the tree - `tauri` reads plists with it.
plist = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "macos", target_os = "windows")))'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio", "raw_handle", "wayland"] }
raw-window-handle = "0.6"

# **`tauri` is one entry above, and that is what the Linux desktop's pause is made of** (§23.7).
# Two
# would be CEF here and Wry elsewhere, which cannot be stated: the Tauri CLI rewrites this file
# before every build and unions a dependency's features across target tables, so `cef` lands on
# the Wry entry too and both runtimes come on at once. Nothing emits a compile_error for that -
# `build.rs` would report `cef`, taking the CEF manifest and rpath, while `Builder::default()`
# still resolves to `Builder<Wry>`, since `#[default_runtime(crate::Wry, wry)]` defaults the
# generic to Wry whenever the `wry` feature is present. macOS and Windows would carry it.
#
# The `cef` feature below is what the bundler is told, and is the only way it carries CEF:
# `tauri-bundler` copies `libcef.so`, the pak files and the locales into a deb, and assembles an
# AppImage with `sharun` rather than `linuxdeploy`, only when its `cef_path` is set - which the
# CLI sets from the features it was passed, resolved against this table rather than a
# dependency's. Both come back together, with `release.yml`'s Linux row.
#
# [target.'cfg(target_os = "linux")'.dependencies]
# tauri = { git = "...", rev = "...", default-features = false, features = ["cef"] }
#
# [features]
# cef = ["tauri/cef"]

[profile.release]
# The symbol table is 9MB of the Windows binary and 3MB of the macOS one, for builds
# nothing debugs remotely.
strip = "symbols"
# Cargo's release defaults are `lto = false` and `codegen-units = 16`, which is per-crate
# optimisation and sixteen independent units inside each one, and a shipped build has no
# reason to leave either there.
lto = "fat"
codegen-units = 1
