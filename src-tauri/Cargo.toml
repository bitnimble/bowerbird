[package]
name = "app"
version = "0.0.0"
description = "Bowerbird desktop shell"
edition = "2021"
# `src/bin/bowerbird-updater.rs` makes this a package of two binaries, and the shell is the one to run.
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# The empty list is not noise: the CLI rewrites this file before every build and writes one in if
# it is not there, so stating it is what keeps a build from leaving the tree dirty.
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1", features = [] }

[dependencies]
# `macos-private-api` is what lets WKWebView take an element fullscreen, which the photo viewer
# offers only where `document.fullscreenEnabled`; `tauri.conf.json`'s `macOSPrivateApi` has to agree.
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# What the shell asks of the local server itself: an export's render, a RAW's path.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["sync"] }
updater = { path = "../native/updater" }
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The folder an export is written into (§10.5.1), asked for in the reader's own file manager.
# `tauri-plugin-dialog` is what would normally provide this and cannot: it depends on `tauri`
# from crates.io where this build takes it from git, which cargo does not unify - two `tauri`
# crates, and every `AppHandle` the wrong type. So the crate the plugin wraps, directly.
#
# The predicate is what tauri's own `desktop` cfg expands to, and `export.rs` gates on that
# cfg - the two have to keep agreeing, because rfd has no backend for Android and does not
# compile there. The portal rather than GTK on Linux: rfd's GTK is 3, the CEF runtime's is 4, and
# one process cannot load both.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# The application chooser "Open in…" shows (`open_with.rs`) and, on Windows, the caption
# buttons' window (`caption.rs`); one table per platform.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"
# The window's screen's HDR headroom (`display.rs`): DXGI is COM, which `windows-sys` has no calls for.
windows = { version = "0.61", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSWorkspace",
  "NSResponder",
  "NSWindow",
  "NSScreen",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSArray"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "macos", target_os = "windows")))'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio", "raw_handle", "wayland"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1", features = ["macos-private-api"] }

[features]
# The build `e2e-tauri/` drives, which reads Chromium switches off its command line on Linux.
e2e = []

# Tauri's own workspace patches, which a git dependency does not inherit. Without it the CEF runtime
# sees two `dpi` crates, winit-gtk4's and crates.io's, and does not compile. `branch` rather than
# `rev` so it is the same source winit-gtk4 names; the lockfile pins the commit.
[patch.crates-io]
dpi = { git = "https://github.com/tauri-apps/winit-gtk4", branch = "master" }

[profile.release]
# The symbol table is 9MB of the Windows binary and 3MB of the macOS one, for builds
# nothing debugs remotely.
strip = "symbols"
# Cargo's release defaults are `lto = false` and `codegen-units = 16`, which is per-crate
# optimisation and sixteen independent units inside each one, and a shipped build has no
# reason to leave either there.
lto = "fat"
codegen-units = 1
